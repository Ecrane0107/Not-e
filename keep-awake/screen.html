<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keep awake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <a class="back-btn" href="../index.html">
    <svg viewBox="0 0 12 12" width="11" height="11" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M7.5 2.5 3 6l4.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Menu
  </a>

  <p class="eyebrow">Project</p>
  <h1>Keep awake</h1>
  <p class="blurb">Leave this tab open and your screen won't sleep. One cigarette burns for about 10 minutes &mdash; never exactly the same length twice &mdash; and lights the next the moment it's out.</p>

  <div class="app">
    <div class="status-line" id="statusLine">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Not lit</span>
    </div>

    <div class="clock" id="clock">10<span class="unit">:00 left on this one</span></div>

    <div class="cig-stage">
      <div class="smoke" id="smoke1"></div>
      <div class="smoke s2" id="smoke2"></div>
      <div class="smoke s3" id="smoke3"></div>
      <div class="cig">
        <div class="cig-filter"></div>
        <div class="cig-paper" id="cigPaper"></div>
        <div class="cig-ash" id="cigAsh" style="width:0"></div>
        <div class="ember out" id="ember"></div>
      </div>
    </div>

    <div class="controls">
      <button class="primary-btn" id="toggleBtn">Light one</button>
      <button class="ghost-btn" id="skipBtn" disabled>Light a new one</button>
    </div>

    <div class="stats">
      <div><b id="statCount">0</b><span>Lit</span></div>
      <div><b id="statTime">0:00</b><span>Time awake</span></div>
    </div>

    <p class="note" id="supportNote"></p>
  </div>

</div>

<script>
  const BASE = 600;       // 10 minutes, in seconds
  const VARIANCE = 90;    // +/- up to 90s, so roughly 8:30-11:30

  const statusLine = document.getElementById("statusLine");
  const statusDot  = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const clockEl    = document.getElementById("clock");
  const paperEl    = document.getElementById("cigPaper");
  const ashEl      = document.getElementById("cigAsh");
  const emberEl    = document.getElementById("ember");
  const toggleBtn  = document.getElementById("toggleBtn");
  const skipBtn    = document.getElementById("skipBtn");
  const statCount  = document.getElementById("statCount");
  const statTime   = document.getElementById("statTime");
  const supportNote = document.getElementById("supportNote");
  const smokeEls   = [document.getElementById("smoke1"), document.getElementById("smoke2"), document.getElementById("smoke3")];

  const PAPER_FULL = 226; // px, total width minus the filter

  let wakeLock = null;
  let active = false;
  let duration = 0;
  let remaining = 0;
  let cigCount = 0;
  let awakeSeconds = 0;
  let tickHandle = null;

  function randomDuration() {
    const offset = Math.round((Math.random() * 2 - 1) * VARIANCE);
    return BASE + offset;
  }

  function formatClock(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ":" + String(sec).padStart(2, "0");
  }

  function formatElapsed(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
    return m + ":" + String(sec).padStart(2, "0");
  }

  function renderCigarette() {
    const progress = duration ? Math.min(1, Math.max(0, 1 - remaining / duration)) : 0;
    const ashWidth = PAPER_FULL * progress;
    const paperWidth = PAPER_FULL - ashWidth;
    paperEl.style.width = paperWidth + "px";
    ashEl.style.width = ashWidth + "px";
    // ember sits right where paper meets ash, in px from the left edge of .cig
    const filterWidth = 54;
    emberEl.style.left = (filterWidth + paperWidth) + "px";
  }

  function renderClock() {
    if (!active) {
      clockEl.innerHTML = '10<span class="unit">:00 left on this one</span>';
      return;
    }
    clockEl.innerHTML = formatClock(remaining) + '<span class="unit">left on this one</span>';
  }

  function renderStats() {
    statCount.textContent = cigCount;
    statTime.textContent = formatElapsed(awakeSeconds);
  }

  function setStatus(text, on) {
    statusText.textContent = text;
    statusLine.classList.toggle("on", !!on);
  }

  async function requestWakeLock() {
    if (!("wakeLock" in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (err) {
      // e.g. tab not visible yet, or permission denied - harmless, we retry on visibilitychange
    }
  }

  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  }

  function lightNew() {
    duration = randomDuration();
    remaining = duration;
    cigCount++;
    emberEl.classList.remove("out");
    renderCigarette();
    renderClock();
    renderStats();
  }

  function tick() {
    if (!active) return;
    remaining--;
    awakeSeconds++;
    if (remaining <= 0) {
      lightNew();
    } else {
      renderCigarette();
      renderClock();
    }
    renderStats();
  }

  function start() {
    active = true;
    requestWakeLock();
    lightNew();
    tickHandle = setInterval(tick, 1000);
    toggleBtn.textContent = "Put it out";
    skipBtn.disabled = false;
    setStatus("Screen will stay awake", true);
    smokeEls.forEach(el => el.style.display = "block");
  }

  function stop() {
    active = false;
    clearInterval(tickHandle);
    releaseWakeLock();
    emberEl.classList.add("out");
    toggleBtn.textContent = "Light one";
    skipBtn.disabled = true;
    setStatus("Not lit", false);
    smokeEls.forEach(el => el.style.display = "none");
    renderClock();
  }

  toggleBtn.addEventListener("click", () => {
    if (active) stop(); else start();
  });

  skipBtn.addEventListener("click", () => {
    if (active) lightNew();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && active && !wakeLock) {
      requestWakeLock();
    }
  });

  if (!("wakeLock" in navigator)) {
    supportNote.textContent = "Your browser doesn't support the Wake Lock API, so this will animate but may not actually stop your screen from sleeping.";
  }

  smokeEls.forEach(el => el.style.display = "none");
  renderClock();
</script>
</body>
</html>
