<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <a class="back-btn" href="../index.html">
    <svg viewBox="0 0 12 12" width="11" height="11" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M7.5 2.5 3 6l4.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Menu
  </a>

  <p class="eyebrow">Project</p>
  <h1>Cig</h1>

  <div class="app">
    <div class="cig-stage" id="cigStage">
      <div class="cig" id="cig">
        <div class="cig-filter"></div>
        <div class="cig-paper" id="cigPaper"></div>
        <div class="ash-clump" id="ashClump" style="width:0"></div>
        <div class="ember out" id="ember"></div>
        <div class="smoke" id="smoke1"></div>
        <div class="smoke s2" id="smoke2"></div>
        <div class="smoke s3" id="smoke3"></div>
      </div>
    </div>

    <div class="controls">
      <button class="primary-btn" id="toggleBtn">Light</button>
      <button class="ghost-btn" id="tapBtn" disabled>Tap ash off</button>
    </div>

    <div class="stats">
      <div><b id="statCount">0</b><span>Lit</span></div>
      <div><b id="statTime">0:00</b><span>Time smoking</span></div>
    </div>

    <p class="note" id="supportNote"></p>
  </div>

</div>

<script>
  const BASE = 600;          // 10 minutes, in seconds
  const VARIANCE = 90;       // +/- up to 90s, so roughly 8:30-11:30
  const ASH_CYCLE_MIN = 16;  // seconds of burn before ash *could* fall
  const ASH_CYCLE_MAX = 34;
  const FILTER_W = 54;       // px, fixed - the butt never burns or shrinks
  const PAPER_FULL = 226;    // px, full unburnt paper length
  const MAX_ASH_W = 20;      // px, how far the ash clump grows before falling

  const cigEl       = document.getElementById("cig");
  const paperEl     = document.getElementById("cigPaper");
  const ashClumpEl  = document.getElementById("ashClump");
  const emberEl     = document.getElementById("ember");
  const toggleBtn   = document.getElementById("toggleBtn");
  const tapBtn      = document.getElementById("tapBtn");
  const statCount   = document.getElementById("statCount");
  const statTime    = document.getElementById("statTime");
  const supportNote = document.getElementById("supportNote");
  const smokeEls    = [document.getElementById("smoke1"), document.getElementById("smoke2"), document.getElementById("smoke3")];

  let wakeLock = null;
  let active = false;
  let duration = 0;
  let remaining = 0;
  let cigCount = 0;
  let awakeSeconds = 0;
  let tickHandle = null;

  let ashProgress = 0;
  let ashCycleLen = randomAshCycle();

  function randomAshCycle() {
    return ASH_CYCLE_MIN + Math.random() * (ASH_CYCLE_MAX - ASH_CYCLE_MIN);
  }

  function randomDuration() {
    const offset = Math.round((Math.random() * 2 - 1) * VARIANCE);
    return BASE + offset;
  }

  function formatElapsed(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
    return m + ":" + String(sec).padStart(2, "0");
  }

  function renderCigarette() {
    const progress = duration ? Math.min(1, Math.max(0, 1 - remaining / duration)) : 0;
    const paperWidth = PAPER_FULL * (1 - progress);
    paperEl.style.width = paperWidth + "px";

    // the tip: where the paper currently ends and the burning happens.
    // the filter side (FILTER_W) never moves and never burns.
    const tipLeft = FILTER_W + paperWidth;
    emberEl.style.left = tipLeft + "px";

    const ashWidth = Math.min(MAX_ASH_W, MAX_ASH_W * ashProgress);
    ashClumpEl.style.left = tipLeft + "px";
    ashClumpEl.style.width = ashWidth + "px";

    smokeEls.forEach(el => { el.style.left = tipLeft + "px"; });
  }

  function renderStats() {
    statCount.textContent = cigCount;
    statTime.textContent = formatElapsed(awakeSeconds);
  }

  async function requestWakeLock() {
    if (!("wakeLock" in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (err) {
      // e.g. tab not visible yet - harmless, we retry on visibilitychange
    }
  }

  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  }

  function spawnAshParticles(atLeft) {
    for (let i = 0; i < 4; i++) {
      const bit = document.createElement("div");
      bit.className = "ash-bit";
      bit.style.left = (atLeft + (Math.random() * 8 - 4)) + "px";
      bit.style.setProperty("--dx", (Math.random() * 26 - 13) + "px");
      bit.style.animationDelay = (Math.random() * 90) + "ms";
      cigEl.appendChild(bit);
      bit.addEventListener("animationend", () => bit.remove());
      setTimeout(() => bit.remove(), 1000); // safety net if animationend doesn't fire
    }
  }

  function shakeCig() {
    cigEl.classList.remove("shake");
    void cigEl.offsetWidth; // restart the animation even if it's already mid-shake
    cigEl.classList.add("shake");
    setTimeout(() => cigEl.classList.remove("shake"), 450);
  }

  function tapAsh() {
    if (!active) return;
    const atLeft = parseFloat(ashClumpEl.style.left || "0") + parseFloat(ashClumpEl.style.width || "0") / 2;
    spawnAshParticles(atLeft);
    shakeCig();
    ashProgress = 0;
    ashCycleLen = randomAshCycle();
    renderCigarette();
  }

  function lightNew() {
    duration = randomDuration();
    remaining = duration;
    cigCount++;
    ashProgress = 0;
    ashCycleLen = randomAshCycle();
    emberEl.classList.remove("out");
    renderCigarette();
    renderStats();
  }

  function tick() {
    if (!active) return;
    remaining--;
    awakeSeconds++;
    ashProgress += 1 / ashCycleLen;

    if (remaining <= 0) {
      lightNew();
    } else {
      if (ashProgress >= 1) tapAsh();
      renderCigarette();
    }
    renderStats();
  }

  function start() {
    active = true;
    requestWakeLock();
    lightNew();
    tickHandle = setInterval(tick, 1000);
    toggleBtn.textContent = "Put it out";
    tapBtn.disabled = false;
    smokeEls.forEach(el => el.style.display = "block");
  }

  function stop() {
    active = false;
    clearInterval(tickHandle);
    releaseWakeLock();
    emberEl.classList.add("out");
    toggleBtn.textContent = "Light";
    tapBtn.disabled = true;
    smokeEls.forEach(el => el.style.display = "none");
  }

  toggleBtn.addEventListener("click", () => {
    if (active) stop(); else start();
  });

  tapBtn.addEventListener("click", tapAsh);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && active && !wakeLock) {
      requestWakeLock();
    }
  });

  if (!("wakeLock" in navigator)) {
    supportNote.textContent = "Your browser doesn't support the Wake Lock API, so this will animate but may not actually stop your screen from sleeping.";
  }

  smokeEls.forEach(el => el.style.display = "none");
  renderCigarette();
</script>
</body>
</html>
