<!doctype html>
<html>
<head>
<script>try{var t=localStorage.getItem("site:theme");document.documentElement.dataset.theme=(t==="light")?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css?v=2">
<link rel="stylesheet" href="../assets/sitebar.css?v=2">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
</div>

<div class="clockface">
  <div class="time" id="time" aria-live="off">
    <span id="hm">00:00</span><span class="sec" id="sec">00</span>
  </div>
  <p class="date" id="date"></p>
</div>


<script src="../assets/spiral-bg.js?v=8"></script>
<script>
  const spiral = initSpiralBackground(document.getElementById("bg"), {
    intensity: 1,
    radiusScale: 0.26,
    barCount: 14,
    cubeCount: 12,
    fps: 30,
  });
  // tint the vignette and the clock's own glow to match this load's random theme
  document.documentElement.style.setProperty("--theme-h", spiral.hue);

  const hmEl = document.getElementById("hm");
  const secEl = document.getElementById("sec");
  const dateEl = document.getElementById("date");
  const dateFormat = new Intl.DateTimeFormat(undefined, {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric",
  });

  function pad(n) { return String(n).padStart(2, "0"); }

  function tick() {
    const now = new Date();
    hmEl.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
    secEl.textContent = pad(now.getSeconds());
    dateEl.textContent = dateFormat.format(now);
  }
  tick();
  setInterval(tick, 250);
</script>
<script src="../assets/sitebar.js?v=2" data-root="../" data-where="PS2 Clock"></script>
</body>
</html>
