<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Schedule</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#10121a;
  --panel:#171a24;
  --grid:#262a36;
  --grid-strong:#333849;
  --text:#e7e8ed;
  --text-dim:#7a8094;
  --text-faint:#4a4f60;
  --accent:#e8a33d;
  --today-tint:rgba(232,163,61,0.055);
  --c-teal:#4fb3a9;
  --c-sky:#5b9bd5;
  --c-violet:#9b7ede;
  --c-rose:#db6e8c;
  --c-sage:#8fae6b;
  --c-amber:#e8a33d;
}
*{box-sizing:border-box;}
html,body{
  margin:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, #1a1e2c 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
/* thin dark scrollbars everywhere on the page, not just the grid's own
   body-rows -- the default light-on-dark browser scrollbar stood out */
*{ scrollbar-width:thin; scrollbar-color:var(--grid-strong) transparent; }
*::-webkit-scrollbar{ width:9px; height:9px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{ background:var(--grid-strong); border-radius:5px; }
*::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }
.wrap{
  max-width:1120px;
  margin:0 auto;
  padding:28px 20px 60px;
}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin-bottom:22px;
  flex-wrap:wrap;
  gap:12px;
}
.title-block h1{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:20px;
  letter-spacing:0.02em;
  margin:0;
  color:var(--text);
}
.title-block .clock{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--text-dim);
  margin-top:4px;
}
.title-block .quickstat{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text-faint);
  margin-top:3px;
}
.title-block .quickstat b{ color:var(--accent); font-weight:700; }
.topbar .actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.btn{
  font-family:'Inter',sans-serif;
  font-size:12.5px;
  font-weight:500;
  color:var(--text-dim);
  background:var(--panel);
  border:1px solid var(--grid-strong);
  border-radius:6px;
  padding:8px 13px;
  cursor:pointer;
  transition:border-color .15s ease, color .15s ease, background .15s ease;
}
.btn:hover{ color:var(--text); border-color:var(--accent); }
.btn.primary{ color:#171304; background:var(--accent); border-color:var(--accent); font-weight:600; }
.btn.primary:hover{ filter:brightness(1.08); }
.btn.danger.confirming{ color:#1a1315; background:var(--c-rose); border-color:var(--c-rose); }
/* the back-to-menu link sits in the same button row as the tool's own
   actions, styled the same way (.btn) so it fits right in -- anchors
   need an explicit inline-block + no underline since .btn was written
   assuming <button> elements */
a.btn{ display:inline-block; text-decoration:none; }

.scroll-outer{
  overflow-x:auto;
  border:1px solid var(--grid-strong);
  border-radius:10px;
  background:var(--panel);
}
.gridwrap{
  position:relative;
  min-width:860px;
}
.header-row{
  display:grid;
  grid-template-columns:64px repeat(7,1fr);
  position:sticky;
  top:0;
  z-index:3;
  background:var(--panel);
  border-bottom:1px solid var(--grid-strong);
}
.header-cell{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:0.08em;
  color:var(--text-dim);
  padding:12px 8px;
  text-align:center;
  border-left:1px solid var(--grid);
}
.header-cell:first-child{ border-left:none; }
.header-cell .dnum{
  display:block;
  font-size:15px;
  color:var(--text);
  margin-top:2px;
  font-weight:700;
}
.header-cell.today{ color:var(--accent); }
.header-cell.today .dnum{ color:var(--accent); }

.body-rows{
  position:relative;
  max-height:66vh;
  overflow-y:auto;
}
.rows-inner{
  position:relative;
}
.row{
  display:grid;
  grid-template-columns:64px repeat(7,1fr);
  height:46px;
  border-top:1px solid var(--grid);
}
.row:first-child{ border-top:none; }
.time-cell{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text-faint);
  padding:4px 8px 0 0;
  text-align:right;
  position:sticky;
  left:0;
  background:var(--panel);
  z-index:2;
}
.slot{
  border-left:1px solid var(--grid);
  position:relative;
  cursor:pointer;
}
.slot:hover{ background:rgba(255,255,255,0.025); }
.slot.today-col{ background:var(--today-tint); }
.slot.today-col:hover{ background:rgba(232,163,61,0.09); }

.overlay{
  position:absolute;
  top:0; left:0; right:0; bottom:0;
  pointer-events:none;
  z-index:1;
}
.block{
  position:absolute;
  pointer-events:auto;
  cursor:pointer;
  border-radius:5px;
  padding:3px 7px;
  overflow:hidden;
  border-left:3px solid var(--text-dim);
  background:rgba(255,255,255,0.05);
  transition:filter .12s ease, transform .12s ease, box-shadow .12s ease;
  animation:block-in .18s ease both;
}
.block:hover{ filter:brightness(1.2); transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,.35); }
@keyframes block-in{ from{ opacity:0; transform:scale(.97); } to{ opacity:1; transform:scale(1); } }
@media (prefers-reduced-motion:reduce){ .block{ animation:none; } }
.block.cut-bottom{
  border-bottom-left-radius:0;
  border-bottom-right-radius:0;
  border-bottom:1px dashed rgba(255,255,255,0.25);
}
.block.cut-top{
  border-top-left-radius:0;
  border-top-right-radius:0;
  border-top:1px dashed rgba(255,255,255,0.25);
}
.block .block-time{
  display:block;
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;
  color:var(--text-dim);
  line-height:1.2;
}
.block .block-text{
  display:block;
  font-size:12px;
  font-weight:500;
  color:var(--text);
  line-height:1.25;
  word-break:break-word;
}

.nowline{
  position:absolute;
  left:0; right:0;
  height:0;
  border-top:1.5px solid var(--accent);
  z-index:2;
  pointer-events:none;
  box-shadow:0 0 8px rgba(232,163,61,0.6);
}
.nowline::before{
  content:'';
  position:absolute;
  left:calc(64px + (100% - 64px) * var(--dayfrac,0) / 7 - 3px);
  top:-3.5px;
  width:7px;height:7px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 6px var(--accent);
}

.status{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text-faint);
  margin-top:10px;
  text-align:center;
}

/* modal -- a quick fade + rise on open instead of an instant snap.
   display stays flex the whole time (display can't be transitioned) and
   opacity/visibility do the actual showing/hiding, with the visibility
   change delayed on close so it isn't interactive while fading out */
.backdrop{
  position:fixed; inset:0;
  background:rgba(8,9,13,0.6);
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  opacity:0;
  visibility:hidden;
  transition:opacity .15s ease, visibility 0s linear .15s;
}
.backdrop.open{
  opacity:1;
  visibility:visible;
  transition:opacity .15s ease;
}
.modal{
  width:100%;
  max-width:380px;
  background:#1c202b;
  border:1px solid var(--grid-strong);
  border-radius:12px;
  padding:20px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);
  transform:translateY(10px) scale(.98);
  transition:transform .15s ease;
}
.backdrop.open .modal{ transform:translateY(0) scale(1); }
@media (prefers-reduced-motion:reduce){
  .backdrop, .modal{ transition:none; }
}
.modal h2{
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  letter-spacing:0.04em;
  margin:0 0 16px;
  color:var(--text);
}
.field{ margin-bottom:14px; }
.field label{
  display:block;
  font-size:11px;
  color:var(--text-dim);
  margin-bottom:6px;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:0.04em;
}
.field input[type=text]{
  width:100%;
  background:#12141c;
  border:1px solid var(--grid-strong);
  border-radius:6px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  padding:9px 10px;
  outline:none;
}
.field input[type=text]:focus{ border-color:var(--accent); }
.day-chips{
  display:flex;
  gap:5px;
}
.chip{
  flex:1;
  text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  padding:7px 0;
  border-radius:5px;
  border:1px solid var(--grid-strong);
  background:#12141c;
  color:var(--text-dim);
  cursor:pointer;
  user-select:none;
}
.chip.selected{
  background:rgba(232,163,61,0.15);
  border-color:var(--accent);
  color:var(--accent);
  font-weight:700;
}
.time-row{
  display:flex;
  gap:10px;
  align-items:center;
}
.time-row .field{ flex:1; margin-bottom:0; }
.time-row input[type=time]{
  width:100%;
  background:#12141c;
  border:1px solid var(--grid-strong);
  border-radius:6px;
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  padding:8px 9px;
  outline:none;
  color-scheme:dark;
}
.time-row input[type=time]:focus{ border-color:var(--accent); }
.time-arrow{ color:var(--text-faint); font-size:13px; margin-top:18px; }
.swatches{
  display:flex;
  gap:8px;
}
.swatch{
  width:22px;height:22px;
  border-radius:50%;
  cursor:pointer;
  border:2px solid transparent;
  opacity:0.5;
}
.swatch.selected{ opacity:1; border-color:var(--text); transform:scale(1.08); }
.hint{
  font-size:11.5px;
  color:var(--c-rose);
  margin-top:8px;
  min-height:14px;
}
.modal-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:6px;
}
.modal-actions .left button{
  background:none; border:none;
  color:var(--text-dim);
  font-size:12px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
}
.modal-actions .left button:hover{ color:var(--c-rose); }
.modal-actions .right{ display:flex; gap:8px; }

.io-textarea{
  width:100%;
  min-height:220px;
  background:#12141c;
  border:1px solid var(--grid-strong);
  border-radius:6px;
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  line-height:1.5;
  padding:10px;
  resize:vertical;
  outline:none;
}
.io-textarea:focus{ border-color:var(--accent); }
.io-toggle{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.io-toggle .opt{
  flex:1;
  text-align:center;
  padding:7px 0;
  border-radius:6px;
  border:1px solid var(--grid-strong);
  background:#12141c;
  color:var(--text-dim);
  font-size:11.5px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
}
.io-toggle .opt.selected{
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(232,163,61,0.12);
  font-weight:600;
}
.io-hint{
  font-size:11.5px;
  color:var(--text-dim);
  margin-top:10px;
  min-height:14px;
}

.legend{
  margin-top:22px;
  border:1px solid var(--grid-strong);
  border-radius:10px;
  background:var(--panel);
  padding:16px 18px 6px;
}
.legend-header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:10px;
}
.legend-header h2{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  letter-spacing:0.06em;
  color:var(--text-dim);
  margin:0;
}
.legend-summary{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  color:var(--text-dim);
}
.legend-summary b{ color:var(--text); font-weight:700; }
.legend-bar{
  height:6px;
  border-radius:4px;
  background:var(--grid);
  overflow:hidden;
  display:flex;
  margin-bottom:14px;
}
.legend-bar-seg{ height:100%; }
.legend-list{
  display:flex;
  flex-direction:column;
}
.legend-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 6px;
  margin:0 -6px;
  border-radius:6px;
  border-top:1px solid var(--grid);
  transition:background .12s ease;
}
.legend-row:hover{ background:rgba(255,255,255,0.03); }
.legend-row:first-child{ border-top:none; }
.legend-dot{
  width:10px; height:10px;
  border-radius:50%;
  flex-shrink:0;
}
.legend-name{
  font-size:13px;
  font-weight:500;
  color:var(--text);
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.legend-days{
  display:flex;
  gap:3px;
  flex-shrink:0;
}
.legend-days span{
  width:16px; height:16px;
  border-radius:3px;
  font-family:'JetBrains Mono',monospace;
  font-size:8.5px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-faint);
  background:var(--grid);
}
.legend-days span.active{
  color:#171304;
  font-weight:700;
}
.legend-hours{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  font-weight:700;
  color:var(--text);
  width:52px;
  text-align:right;
  flex-shrink:0;
}
.legend-empty{
  font-size:12.5px;
  color:var(--text-faint);
  padding:10px 0 16px;
  text-align:center;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title-block">
      <h1>WEEKLY SCHEDULE</h1>
      <div class="clock" id="clock"></div>
      <div class="quickstat" id="quickstat"></div>
    </div>
    <div class="actions">
      <a class="btn" href="../index.html">&larr; Menu</a>
      <button class="btn primary" id="addActivity">+ Add activity</button>
      <button class="btn" id="jumpNow">&#8635; Jump to now</button>
      <button class="btn" id="exportBtn">&#8681; Export JSON</button>
      <button class="btn" id="importBtn">&#8679; Import JSON</button>
      <button class="btn danger" id="clearWeek">&#10005; Clear week</button>
    </div>
  </div>

  <div class="scroll-outer">
    <div class="gridwrap" id="gridwrap">
      <div class="header-row" id="headerRow"></div>
      <div class="body-rows" id="bodyRows">
        <div class="rows-inner" id="rowsInner">
          <div class="overlay" id="overlay"></div>
          <div class="nowline" id="nowline"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="status" id="status">loading&hellip;</div>

  <div class="legend" id="legendPanel">
    <div class="legend-header">
      <h2>LEGEND</h2>
      <div class="legend-summary" id="legendSummary"></div>
    </div>
    <div class="legend-bar" id="legendBar"></div>
    <div class="legend-list" id="legendList"></div>
  </div>
</div>

<div class="backdrop" id="backdrop">
  <div class="modal">
    <h2 id="modalTitle">ADD ACTIVITY</h2>
    <div class="field">
      <label>Activity</label>
      <input type="text" id="fText" maxlength="60" placeholder="e.g. Gym, Study, Standup">
    </div>
    <div class="field">
      <label>Days</label>
      <div class="day-chips" id="dayChips"></div>
    </div>
    <div class="field">
      <div class="time-row">
        <div class="field">
          <label>Start</label>
          <input type="time" id="fStart" step="900">
        </div>
        <div class="time-arrow">&rarr;</div>
        <div class="field">
          <label>End</label>
          <input type="time" id="fEnd" step="900">
        </div>
      </div>
    </div>
    <div class="field">
      <label>Color</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="modal-actions">
      <div class="left"><button id="fDelete" style="display:none;">Delete activity</button></div>
      <div class="right">
        <button class="btn" id="fCancel">Cancel</button>
        <button class="btn primary" id="fSave">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="backdrop" id="ioBackdrop">
  <div class="modal" style="max-width:480px;">
    <h2 id="ioTitle">EXPORT SCHEDULE</h2>
    <textarea class="io-textarea" id="ioTextarea" spellcheck="false" placeholder='[
  { "text": "Sleep", "days": ["mon","tue","wed","thu","fri"], "start": "21:00", "end": "05:00", "color": "violet" },
  { "text": "Gym", "days": ["mon","wed","fri"], "start": "06:30", "end": "07:30", "color": "sage" }
]'></textarea>
    <div class="io-toggle" id="ioToggle" style="display:none;">
      <div class="opt selected" data-mode="add">Add to current schedule</div>
      <div class="opt" data-mode="replace">Replace current schedule</div>
    </div>
    <div class="io-hint" id="ioHint"></div>
    <div class="modal-actions">
      <div class="left"></div>
      <div class="right" id="ioActionsExport" style="display:none;">
        <button class="btn" id="ioCopy">Copy JSON</button>
        <button class="btn" id="ioDownload">Download .json</button>
        <button class="btn" id="ioCloseExport">Done</button>
      </div>
      <div class="right" id="ioActionsImport" style="display:none;">
        <button class="btn" id="ioCancelImport">Cancel</button>
        <button class="btn primary" id="ioLoad">Load JSON</button>
      </div>
    </div>
  </div>
</div>

<script>
const DAYS = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const TAGS = {
  teal:'#4fb3a9', sky:'#5b9bd5', violet:'#9b7ede',
  rose:'#db6e8c', sage:'#8fae6b', amber:'#e8a33d'
};
const STORE_KEY = 'weekly-schedule-v2';
const ROW_H = 46;
const PX_PER_MIN = ROW_H / 60;

let activities = []; // {id, text, color, days:[0..6], start:'HH:MM', end:'HH:MM'}
let columnMetrics = [];
let saveTimer = null;
let editingId = null;

function todayIdx(){ const d = new Date().getDay(); return d===0 ? 6 : d-1; }
function pad(n){ return String(n).padStart(2,'0'); }
function timeToMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function uid(){ return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ---------- grid skeleton ----------
function buildHeader(){
  const el = document.getElementById('headerRow');
  el.innerHTML = '<div class="header-cell"></div>';
  const t = todayIdx();
  DAYS.forEach((d,i)=>{
    const div = document.createElement('div');
    div.className = 'header-cell' + (i===t ? ' today' : '');
    div.innerHTML = d + '<span class="dnum">' + (i===t ? '•' : '') + '</span>';
    el.appendChild(div);
  });
}

function buildRows(){
  const inner = document.getElementById('rowsInner');
  const t = todayIdx();
  for(let h=0; h<24; h++){
    const row = document.createElement('div');
    row.className = 'row';
    const tc = document.createElement('div');
    tc.className = 'time-cell';
    tc.textContent = pad(h) + ':00';
    row.appendChild(tc);
    for(let d=0; d<7; d++){
      const slot = document.createElement('div');
      slot.className = 'slot' + (d===t ? ' today-col' : '');
      slot.dataset.day = d;
      slot.dataset.hour = h;
      slot.addEventListener('click', ()=> openModal({ day:d, hour:h }));
      row.appendChild(slot);
    }
    inner.insertBefore(row, document.getElementById('overlay'));
  }
}

function measureColumns(){
  const cells = document.querySelectorAll('#headerRow .header-cell');
  const gridRect = document.getElementById('gridwrap').getBoundingClientRect();
  const cols = [];
  cells.forEach(c=>{
    const r = c.getBoundingClientRect();
    cols.push({ left: r.left - gridRect.left, width: r.width });
  });
  columnMetrics = cols;
}

// ---------- rendering activity blocks ----------
function drawBlock(overlay, day, startMin, endMin, act, opts){
  const col = columnMetrics[day + 1];
  if(!col) return;
  const top = startMin * PX_PER_MIN;
  const height = Math.max(16, (endMin - startMin) * PX_PER_MIN - 2);
  const block = document.createElement('div');
  block.className = 'block' + (opts.cutBottom ? ' cut-bottom' : '') + (opts.cutTop ? ' cut-top' : '');
  block.style.left = (col.left + 2) + 'px';
  block.style.width = (col.width - 4) + 'px';
  block.style.top = (top + 1) + 'px';
  block.style.height = height + 'px';
  const hex = TAGS[act.color];
  if(hex){
    block.style.borderLeftColor = hex;
    block.style.background = hexToRgba(hex, 0.16);
  }
  const showTime = height >= 30;
  const label = (opts.prefix || '') + escapeHtml(act.text) + (opts.suffix || '');
  block.innerHTML =
    (showTime ? '<span class="block-time">' + act.start + '–' + act.end + '</span>' : '') +
    '<span class="block-text">' + label + '</span>';
  block.title = act.text + ' (' + act.start + '–' + act.end + (opts.cutBottom ? ', continues past midnight' : opts.cutTop ? ', continued from previous day' : '') + ')';
  block.addEventListener('click', (e)=>{ e.stopPropagation(); openModal({ activity: act }); });
  overlay.appendChild(block);
}

function renderActivities(){
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = '';
  if(!columnMetrics.length) measureColumns();

  activities.forEach(act=>{
    const startMin = timeToMinutes(act.start);
    const endMin = timeToMinutes(act.end);
    if(endMin === startMin) return;
    const overnight = endMin < startMin;

    act.days.forEach(d=>{
      if(!overnight){
        drawBlock(overlay, d, startMin, endMin, act, {});
      } else {
        drawBlock(overlay, d, startMin, 1440, act, { cutBottom:true, suffix:' ⤵' });
        const d2 = (d + 1) % 7;
        drawBlock(overlay, d2, 0, endMin, act, { cutTop:true, prefix:'⤴ ' });
      }
    });
  });

  renderLegend();
}

const DAY_LETTERS = ['M','T','W','T','F','S','S'];

function activityWeeklyMinutes(act){
  const startMin = timeToMinutes(act.start);
  const endMin = timeToMinutes(act.end);
  if(endMin === startMin) return 0;
  const perDay = endMin > startMin ? (endMin - startMin) : ((1440 - startMin) + endMin);
  return perDay * act.days.length;
}

function renderLegend(){
  const list = document.getElementById('legendList');
  const bar = document.getElementById('legendBar');
  const summary = document.getElementById('legendSummary');
  list.innerHTML = '';
  bar.innerHTML = '';

  if(activities.length === 0){
    list.innerHTML = '<div class="legend-empty">No activities yet — add one to see it here.</div>';
    summary.innerHTML = '<b>0h</b> scheduled of 168h this week';
    document.getElementById('quickstat').textContent = 'Nothing scheduled yet';
    return;
  }

  // merge entries that share the same name (case-insensitive)
  const merged = new Map();
  activities.forEach(act=>{
    const key = act.text.trim().toLowerCase();
    if(!merged.has(key)){
      merged.set(key, { text: act.text.trim(), color: act.color, minutes: 0, days: new Set() });
    }
    const m = merged.get(key);
    if(!m.color && act.color) m.color = act.color;
    m.minutes += activityWeeklyMinutes(act);
    act.days.forEach(d=>m.days.add(d));
  });

  const rows = Array.from(merged.values()).sort((a,b)=>b.minutes - a.minutes);
  const totalScheduledMin = rows.reduce((s,r)=>s+r.minutes,0);
  const totalWeekMin = 7 * 1440;
  const freeMin = Math.max(0, totalWeekMin - totalScheduledMin);

  function fmtHours(min){
    const h = min / 60;
    return (Math.round(h*10)/10) + 'h';
  }

  summary.innerHTML = '<b>' + fmtHours(totalScheduledMin) + '</b> scheduled · <b>' + fmtHours(freeMin) + '</b> free of 168h' +
    (totalScheduledMin > totalWeekMin ? ' <span style="color:var(--c-rose)">(overlapping)</span>' : '');
  document.getElementById('quickstat').innerHTML = '<b>' + fmtHours(freeMin) + '</b> free this week';

  rows.forEach(r=>{
    const hex = TAGS[r.color] || 'var(--text-faint)';
    const pct = Math.min(100, (r.minutes / totalWeekMin) * 100);
    if(pct > 0){
      const seg = document.createElement('div');
      seg.className = 'legend-bar-seg';
      seg.style.width = pct + '%';
      seg.style.background = hex;
      bar.appendChild(seg);
    }
  });

  rows.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'legend-row';

    const dot = document.createElement('div');
    dot.className = 'legend-dot';
    dot.style.background = TAGS[r.color] || 'var(--text-faint)';
    row.appendChild(dot);

    const name = document.createElement('div');
    name.className = 'legend-name';
    name.textContent = r.text;
    row.appendChild(name);

    const daysEl = document.createElement('div');
    daysEl.className = 'legend-days';
    DAY_LETTERS.forEach((letter, i)=>{
      const s = document.createElement('span');
      s.textContent = letter;
      if(r.days.has(i)){
        s.classList.add('active');
        s.style.background = TAGS[r.color] || 'var(--text-dim)';
      }
      daysEl.appendChild(s);
    });
    row.appendChild(daysEl);

    const hours = document.createElement('div');
    hours.className = 'legend-hours';
    hours.textContent = fmtHours(r.minutes);
    row.appendChild(hours);

    list.appendChild(row);
  });
}

function hexToRgba(hex, alpha){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function positionNowLine(){
  const now = new Date();
  const frac = now.getHours() + now.getMinutes()/60;
  const line = document.getElementById('nowline');
  line.style.top = (frac * ROW_H) + 'px';
  line.style.setProperty('--dayfrac', todayIdx());
}
function updateClock(){
  const now = new Date();
  const dateStr = now.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
  const timeStr = now.toLocaleTimeString(undefined, {hour:'2-digit',minute:'2-digit'});
  document.getElementById('clock').textContent = dateStr + '  ·  ' + timeStr;
}

async function loadSchedule(){
  const statusEl = document.getElementById('status');
  try{
    const raw = localStorage.getItem(STORE_KEY);
    activities = raw ? JSON.parse(raw) : [];
  }catch(e){
    activities = [];
  }
  if(activities.length === 0){
    try{
      activities = parseImportJSON(SEED_JSON);
      queueSave();
    }catch(e){ /* seed failed silently, start blank */ }
  }
  statusEl.textContent = 'saved to your device — this schedule stays private to you';
  renderActivities();
}
function queueSave(){
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(activities));
      statusEl.textContent = 'saved to your device — this schedule stays private to you';
    }catch(e){
      statusEl.textContent = "couldn't save — changes may not persist";
    }
  }, 250);
}

// ---------- modal ----------
let selectedDays = new Set();
let selectedColor = null;

function buildDayChips(){
  const el = document.getElementById('dayChips');
  el.innerHTML = '';
  DAYS.forEach((d,i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = d;
    chip.dataset.day = i;
    chip.addEventListener('click', ()=>{
      if(selectedDays.has(i)) selectedDays.delete(i); else selectedDays.add(i);
      refreshChips();
    });
    el.appendChild(chip);
  });
}
function refreshChips(){
  document.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('selected', selectedDays.has(Number(c.dataset.day)));
  });
}
function buildSwatches(){
  const el = document.getElementById('swatches');
  el.innerHTML = '';
  Object.entries(TAGS).forEach(([name,hex])=>{
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = hex;
    sw.dataset.name = name;
    sw.addEventListener('click', ()=>{
      selectedColor = (selectedColor === name) ? null : name;
      refreshSwatches();
    });
    el.appendChild(sw);
  });
}
function refreshSwatches(){
  document.querySelectorAll('.swatch').forEach(sw=>{
    sw.classList.toggle('selected', sw.dataset.name === selectedColor);
  });
}

function openModal(opts){
  document.getElementById('hint').textContent = '';
  if(opts.activity){
    const act = opts.activity;
    editingId = act.id;
    document.getElementById('modalTitle').textContent = 'EDIT ACTIVITY';
    document.getElementById('fText').value = act.text;
    document.getElementById('fStart').value = act.start;
    document.getElementById('fEnd').value = act.end;
    selectedDays = new Set(act.days);
    selectedColor = act.color || null;
    document.getElementById('fDelete').style.display = 'inline-block';
  } else {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'ADD ACTIVITY';
    document.getElementById('fText').value = '';
    const day = opts.day !== undefined ? opts.day : todayIdx();
    const hour = opts.hour !== undefined ? opts.hour : new Date().getHours();
    document.getElementById('fStart').value = pad(hour) + ':00';
    document.getElementById('fEnd').value = hour < 23 ? (pad(hour+1) + ':00') : '23:59';
    selectedDays = new Set([day]);
    selectedColor = null;
    document.getElementById('fDelete').style.display = 'none';
  }
  refreshChips();
  refreshSwatches();
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('fText').focus();
}
function closeModal(){
  document.getElementById('backdrop').classList.remove('open');
  editingId = null;
}

function checkOvernightHint(){
  const hint = document.getElementById('hint');
  const start = document.getElementById('fStart').value;
  const end = document.getElementById('fEnd').value;
  if(start && end && timeToMinutes(end) < timeToMinutes(start)){
    hint.style.color = 'var(--text-dim)';
    hint.textContent = "Runs past midnight — it'll continue into the next day on the grid.";
  } else {
    hint.textContent = '';
  }
}
document.getElementById('fStart').addEventListener('input', checkOvernightHint);
document.getElementById('fEnd').addEventListener('input', checkOvernightHint);

document.getElementById('addActivity').addEventListener('click', ()=> openModal({}));
document.getElementById('fCancel').addEventListener('click', closeModal);
document.getElementById('backdrop').addEventListener('mousedown', (e)=>{
  if(e.target.id === 'backdrop') closeModal();
});

document.getElementById('fSave').addEventListener('click', ()=>{
  const text = document.getElementById('fText').value.trim();
  const start = document.getElementById('fStart').value;
  const end = document.getElementById('fEnd').value;
  const hint = document.getElementById('hint');

  if(!text){ hint.textContent = 'Give the activity a name.'; return; }
  if(selectedDays.size === 0){ hint.textContent = 'Pick at least one day.'; return; }
  if(!start || !end){ hint.textContent = 'Set a start and end time.'; return; }
  if(timeToMinutes(end) === timeToMinutes(start)){ hint.textContent = "Start and end can't be the same time."; return; }

  const days = Array.from(selectedDays).sort();
  if(editingId){
    const act = activities.find(a=>a.id===editingId);
    if(act){ act.text=text; act.start=start; act.end=end; act.color=selectedColor; act.days=days; }
  } else {
    activities.push({ id: uid(), text, start, end, color: selectedColor, days });
  }
  renderActivities();
  queueSave();
  closeModal();
});

document.getElementById('fDelete').addEventListener('click', ()=>{
  if(editingId){
    activities = activities.filter(a=>a.id!==editingId);
    renderActivities();
    queueSave();
  }
  closeModal();
});

document.addEventListener('keydown', (e)=>{

    btn.classList.add('confirming');
    setTimeout(()=>{

// ---------- import / export ----------
const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_FULL = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
const TIME_RE = /^([01]\d|2[0-3]):([0-5]\d)$/;
let ioMode = 'export';
let importMerge = 'add';

function dayIndexFromKey(k){
  if(typeof k === 'number') return (k>=0 && k<=6) ? k : null;
  const s = String(k).trim().toLowerCase();
  let idx = DAY_KEYS.indexOf(s.slice(0,3));
  if(idx>=0) return idx;
  idx = DAY_FULL.indexOf(s);
  return idx>=0 ? idx : null;
}

function activitiesToJSON(){
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    activities: activities.map(a=>({
      text: a.text,
      days: a.days.slice().sort().map(d=>DAY_KEYS[d]),
      start: a.start,
      end: a.end,
      color: a.color || null
    }))
  };
  return JSON.stringify(data, null, 2);
}

function parseImportJSON(str){
  let obj;
  try{ obj = JSON.parse(str); }
  catch(e){ throw new Error("That doesn't look like valid JSON."); }
  const list = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.activities) ? obj.activities : null);
  if(!list) throw new Error('Expected a JSON array of activities, or an object with an "activities" array.');
  const parsed = [];
  list.forEach((item, i)=>{
    const n = i + 1;
    if(!item || typeof item.text !== 'string' || !item.text.trim()) throw new Error('Activity #' + n + ' is missing "text".');
    if(typeof item.start !== 'string' || !TIME_RE.test(item.start) || typeof item.end !== 'string' || !TIME_RE.test(item.end)){
      throw new Error('Activity #' + n + ' ("' + item.text + '") needs "start"/"end" as 24hr times, e.g. "09:00".');
    }
    if(item.start === item.end) throw new Error('Activity #' + n + ' ("' + item.text + '") — start and end can\'t match.');
    const rawDays = Array.isArray(item.days) ? item.days : [item.days];
    const days = Array.from(new Set(rawDays.map(dayIndexFromKey).filter(d=>d!==null))).sort();
    if(days.length === 0) throw new Error('Activity #' + n + ' ("' + item.text + '") has no recognizable days (use "mon".."sun").');
    const color = item.color && TAGS[item.color] ? item.color : null;
    parsed.push({ id: uid(), text: item.text.trim(), start: item.start, end: item.end, color, days });
  });
  return parsed;
}

function openExportModal(){
  ioMode = 'export';
  document.getElementById('ioTitle').textContent = 'EXPORT SCHEDULE';
  const ta = document.getElementById('ioTextarea');
  ta.value = activitiesToJSON();
  ta.readOnly = true;
  document.getElementById('ioToggle').style.display = 'none';
  document.getElementById('ioActionsExport').style.display = 'flex';
  document.getElementById('ioActionsImport').style.display = 'none';
  document.getElementById('ioHint').textContent = activities.length + ' activit' + (activities.length===1?'y':'ies') + ' — copy this or download it to move your schedule elsewhere.';
  document.getElementById('ioHint').style.color = 'var(--text-dim)';
  document.getElementById('ioBackdrop').classList.add('open');
}
function openImportModal(){
  ioMode = 'import';
  importMerge = 'add';
  document.getElementById('ioTitle').textContent = 'IMPORT SCHEDULE';
  const ta = document.getElementById('ioTextarea');
  ta.value = '';
  ta.readOnly = false;
  document.getElementById('ioToggle').style.display = 'flex';
  document.querySelectorAll('#ioToggle .opt').forEach(o=>o.classList.toggle('selected', o.dataset.mode==='add'));
  document.getElementById('ioActionsExport').style.display = 'none';
  document.getElementById('ioActionsImport').style.display = 'flex';
  document.getElementById('ioHint').textContent = 'Paste JSON in the format shown by Export.';
  document.getElementById('ioHint').style.color = 'var(--text-dim)';
  document.getElementById('ioBackdrop').classList.add('open');
  ta.focus();
}
function closeIOModal(){
  document.getElementById('ioBackdrop').classList.remove('open');
}

document.getElementById('exportBtn').addEventListener('click', openExportModal);
document.getElementById('importBtn').addEventListener('click', openImportModal);
document.getElementById('ioCloseExport').addEventListener('click', closeIOModal);
document.getElementById('ioCancelImport').addEventListener('click', closeIOModal);
document.getElementById('ioBackdrop').addEventListener('mousedown', (e)=>{
  if(e.target.id === 'ioBackdrop') closeIOModal();
});

document.querySelectorAll('#ioToggle .opt').forEach(opt=>{
  opt.addEventListener('click', ()=>{
    importMerge = opt.dataset.mode;
    document.querySelectorAll('#ioToggle .opt').forEach(o=>o.classList.toggle('selected', o===opt));
  });
});

document.getElementById('ioCopy').addEventListener('click', async ()=>{
  const ta = document.getElementById('ioTextarea');
  const hint = document.getElementById('ioHint');
  try{
    await navigator.clipboard.writeText(ta.value);
    hint.style.color = 'var(--c-sage)';
    hint.textContent = 'Copied to clipboard.';
  }catch(e){
    ta.focus();
    ta.select();
    hint.style.color = 'var(--text-dim)';
    hint.textContent = "Couldn't auto-copy — text is selected, press Ctrl/Cmd+C.";
  }
});
document.getElementById('ioDownload').addEventListener('click', ()=>{
  try{
    const blob = new Blob([document.getElementById('ioTextarea').value], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'weekly-schedule.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    document.getElementById('ioHint').style.color = 'var(--c-rose)';
    document.getElementById('ioHint').textContent = 'Download blocked here — use Copy JSON instead.';
  }
});
document.getElementById('ioLoad').addEventListener('click', ()=>{
  const hint = document.getElementById('ioHint');
  try{
    const parsed = parseImportJSON(document.getElementById('ioTextarea').value);
    activities = importMerge === 'replace' ? parsed : activities.concat(parsed);
    renderActivities();
    queueSave();
    hint.style.color = 'var(--c-sage)';
    hint.textContent = 'Loaded ' + parsed.length + ' activit' + (parsed.length===1?'y':'ies') + '.';
    setTimeout(closeIOModal, 800);
  }catch(e){
    hint.style.color = 'var(--c-rose)';
    hint.textContent = e.message;
  }
});
