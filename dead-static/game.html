<!doctype html>
<html>
<head>
<script>try{var t=localStorage.getItem("site:theme");document.documentElement.dataset.theme=(t==="light")?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dead Static</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700;900&family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css?v=2">
<link rel="stylesheet" href="../assets/sitebar.css?v=2">
<link rel="stylesheet" href="style.css?v=2">
<style>
  .back-btn{
    position:fixed;
    top:14px;
    right:14px;
    z-index:1000;
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    background:rgba(5,8,7,.72);
    border:1px solid rgba(216,162,74,.35);
    border-radius:0;
    color:#c9cdc2;
    font:600 11px "Geist Mono",monospace;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-decoration:none;
    backdrop-filter:blur(4px);
  }
  .back-btn:hover{color:#0c0d0a;background:#d8a24a;border-color:#d8a24a}
</style>
</head>
<body>

<div id="root"></div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "three": "https://esm.sh/three@0.181.0"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script type="module">
  const source = await fetch('game.tsx').then(r => r.text());
  const { code } = Babel.transform(source, {
    presets: [
      ['typescript', { isTSX: true, allExtensions: true }],
      ['react', { runtime: 'classic' }],
    ],
    filename: 'game.tsx',
    sourceType: 'module',
  });
  const blobUrl = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
  await import(blobUrl);
</script>

<script src="../assets/sitebar.js?v=2" data-root="../" data-where="Dead Static"></script>
</body>
</html>
